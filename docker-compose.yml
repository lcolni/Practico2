version: '3.8'

services:
  web:
    build: .
    container_name: biblioteca_web
    ports:
      - "8080:80"
    volumes:
      - ./dist:/var/www/html
    restart: always
    networks:
      - biblioteca_net

  db:
    image: mysql:8.0
    container_name: biblioteca_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: biblioteca_db
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    networks:
      - biblioteca_net

  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: biblioteca_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    restart: always
    networks:
      - biblioteca_net

volumes:
  db_data:

networks:
  biblioteca_net:
    driver: bridge